[project]
name = "monologue-coach-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]
